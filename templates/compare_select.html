{% extends "base.html" %}
{% block title %}Compare Platforms{% endblock %}
{% block content %}
<section>
    <div class="container">
        <h3>Select Platforms to Compare</h3>
        <form class="compare-form" action="/compare" method="get">
            <div class="compare-grid">
                {% for p in platforms %}
                <label>
                    <input type="checkbox" name="p" value="{{ p.id }}">
                    {{ p.name }} ({{ p.overall_score }})
                </label>
                {% endfor %}
            </div>
            <button type="submit" onclick="buildIds(event)">Compare Selected</button>
        </form>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
function buildIds(e) {
    e.preventDefault();
    const checked = document.querySelectorAll('input[name=p]:checked');
    if (checked.length < 2) { alert('Select at least 2 platforms'); return; }
    const ids = Array.from(checked).map(c => c.value).join(',');
    window.location.href = '/compare?ids=' + ids;
}
</script>
{% endblock %}
